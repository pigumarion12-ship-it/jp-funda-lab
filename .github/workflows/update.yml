name: update

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "update / edinet / articles / build / all"
        required: false
        default: "all"
      backfill_days:
        description: "EDINET取得日数 (mode=edinet/all時。既定10)"
        required: false
        default: ""
      full_prices:
        description: "株価を全量取り直す(分割調整反映)なら 1"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore data cache
        uses: actions/cache@v4
        with:
          path: cache
          key: funda-cache-${{ github.run_id }}
          restore-keys: funda-cache-

      - name: Install deps
        run: pip install -q requests pandas numpy pyarrow jquants-api-client

      - name: Update & build
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
          MODE: ${{ inputs.mode }}
          BACKFILL_DAYS: ${{ inputs.backfill_days }}
          PRICE_FULL_REFRESH: ${{ inputs.full_prices }}
        run: |
          mkdir -p reports
          set -o pipefail
          M="${MODE:-all}"
          python run.py "$M" 2>&1 | tee reports/run_log.txt
          if [ "$M" = "edinet" ]; then
            python run.py build 2>&1 | tee -a reports/run_log.txt
          fi

      - name: Commit outputs
        if: always()
        run: |
          git config user.name "funda-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/data reports/
          git diff --cached --quiet || git commit -m "update: $(date -u +%F)"
          for i in 1 2 3; do
            git push && break
            git pull --rebase --autostash origin main || { git rebase --abort || true; git pull -X ours --no-rebase origin main; }
            sleep 5
          done
