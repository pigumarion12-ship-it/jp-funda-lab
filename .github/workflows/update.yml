name: update

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "update / build / all"
        required: false
        default: "all"
  schedule:
    # 平日 20:30 JST = 11:30 UTC (月-金)
    - cron: "30 11 * * 1-5"

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore data cache
        uses: actions/cache@v4
        with:
          path: cache
          key: funda-cache-${{ github.run_id }}
          restore-keys: funda-cache-

      - name: Install deps
        run: pip install -q requests pandas numpy pyarrow jquants-api-client

      - name: Update & build
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          MODE: ${{ inputs.mode }}
        run: |
          mkdir -p reports
          set -o pipefail
          python run.py "${MODE:-all}" 2>&1 | tee reports/run_log.txt

      - name: Commit outputs
        if: always()
        run: |
          git config user.name "funda-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/data reports/
          git diff --cached --quiet || git commit -m "update: $(date -u +%F)"
          for i in 1 2 3; do
            git push && break
            git pull --rebase --autostash origin main || { git rebase --abort || true; git pull -X ours --no-rebase origin main; }
            sleep 5
          done
