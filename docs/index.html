<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>FundaLab | ファンダラボ</title>
<style>
:root{
  --bg:#f2f6fb; --card:#ffffff; --text:#0e2038; --sub:#5f7189; --line:#e2e9f2;
  --accent:#1d5df2; --accent2:#38bdf8; --good:#089c6d; --warn:#d97706; --bad:#dc2626;
  --chip:#eef3fa; --drawer:#ffffff; --hover:#eaf1fd;
  --shadow:0 1px 2px rgba(14,32,56,.05), 0 4px 18px rgba(14,32,56,.05);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0b1524; --card:#121f33; --text:#e9eff8; --sub:#8ba0ba; --line:#22344e;
         --accent:#4c8dff; --accent2:#38bdf8; --good:#34d399; --warn:#fbbf24; --bad:#f87171;
         --chip:#1a2942; --drawer:#0e1a2c; --hover:#1a2942;
         --shadow:0 1px 2px rgba(0,0,0,.3); }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  font-size:14px; line-height:1.55;
  -webkit-font-smoothing:antialiased;}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;
  padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line);
  box-shadow:0 1px 8px rgba(14,32,56,.04)}
header::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--accent),var(--accent2))}
#menuBtn{border:1px solid var(--line);background:var(--card);color:var(--accent);
  border-radius:9px;font-size:17px;padding:5px 11px;cursor:pointer}
.brand{display:flex;align-items:center;gap:10px}
.bmark{flex:none;box-shadow:0 4px 10px rgba(29,93,242,.35);border-radius:8px}
.bword{font-size:17px;font-weight:800;letter-spacing:.06em;line-height:1.1}
.bword span{color:var(--accent)}
.sub{color:var(--sub);font-size:10.5px;margin-top:1px}
.vhead{font-weight:800;font-size:19px;padding:16px 16px 0;letter-spacing:.01em}

/* drawer */
#drawer{position:fixed;top:0;left:0;bottom:0;width:236px;background:var(--drawer);
  border-right:1px solid var(--line);z-index:40;transform:translateX(-100%);
  transition:transform .18s ease;padding:16px 12px;overflow-y:auto}
#drawer.open{transform:none}
#overlay{position:fixed;inset:0;background:rgba(8,20,40,.45);z-index:30;display:none}
#overlay.show{display:block}
.dttl{font-size:10.5px;color:var(--sub);margin:16px 10px 5px;letter-spacing:.12em;font-weight:600}
.mi{display:block;width:100%;text-align:left;border:0;background:none;color:var(--text);
  font-size:14px;font-weight:500;padding:9px 12px;border-radius:10px;cursor:pointer}
.mi:hover{background:var(--hover)}
.mi.active{background:var(--accent);color:#fff;font-weight:600;
  box-shadow:0 4px 12px rgba(29,93,242,.3)}
.mi.dis{color:var(--sub);opacity:.55}
.mi.dis:hover{background:none}
@media(min-width:960px){
  #drawer{transform:none}
  main{margin-left:236px}
  header{margin-left:236px}
  #menuBtn{display:none}
  #overlay{display:none!important}
}
.dbrand{display:flex;align-items:center;gap:9px;padding:4px 8px 12px;
  border-bottom:1px solid var(--line);margin-bottom:6px}
.dbrand .bword{font-size:15.5px}

.toolbar{display:flex;gap:8px;padding:12px 14px 8px;align-items:center}
.toolbar input{flex:1;padding:9px 14px;border:1px solid var(--line);border-radius:11px;
  background:var(--card);color:var(--text);font-size:13px;outline:none}
.toolbar input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(29,93,242,.12)}
.count{color:var(--sub);font-size:12px;white-space:nowrap}
.note{color:var(--sub);font-size:11px;padding:0 18px 8px}
.list{padding:0 12px 44px;display:flex;flex-direction:column;gap:10px;max-width:860px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:12px 14px;box-shadow:var(--shadow)}
.row1{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.nm{font-weight:700;font-size:15px}
.cd{color:var(--sub);font-weight:400;font-size:12px;margin-left:5px}
.score{font-weight:800;color:var(--accent);font-size:16.5px;white-space:nowrap;
  font-variant-numeric:tabular-nums}
.row2{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:7px;font-size:12.5px;
  font-variant-numeric:tabular-nums}
.kv b{font-weight:700}
.kv .l{color:var(--sub);font-size:11px}
.chips{margin-top:7px;display:flex;flex-wrap:wrap;gap:4px}
.chip{background:var(--chip);border-radius:7px;padding:2px 8px;font-size:11px;color:var(--sub);
  font-weight:500}
.chip.g{color:var(--good)} .chip.w{color:var(--warn)} .chip.b{color:var(--bad)}
.detail{display:none;margin-top:9px;border-top:1px solid var(--line);padding-top:9px;font-size:12.5px}
.card.open .detail{display:block}
.card.open{border-color:var(--accent)}
.hist{color:var(--sub)}
.links a{color:var(--accent);text-decoration:none;margin-right:14px;font-weight:600}
.empty{color:var(--sub);text-align:center;padding:44px 16px}
.pos{color:var(--good)} .neg{color:var(--bad)}
footer{color:var(--sub);font-size:11px;padding:0 18px 34px}
.grades{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.gr{display:inline-flex;flex-direction:column;align-items:center;border:1px solid var(--line);
  background:var(--chip);border-radius:9px;padding:3px 7px;min-width:46px}
.gr .gl{font-size:9.5px;color:var(--sub)}
.gr .gv{font-weight:800;font-size:14.5px}
.gA{color:var(--good)} .gB{color:var(--accent)} .gC{color:var(--sub)}
.gD{color:var(--warn)} .gE{color:var(--bad)}
.comment{margin-top:9px;background:linear-gradient(135deg,rgba(29,93,242,.06),rgba(56,189,248,.06));
  border:1px solid rgba(29,93,242,.18);border-radius:11px;padding:9px 11px;font-size:12.5px}
.comment .ct{font-weight:700;font-size:11.5px;color:var(--accent);margin-bottom:3px}
/* articles */
.feed{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;
  box-shadow:var(--shadow)}
.fhead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.fttl{font-weight:700;font-size:14.5px}
.fdesc{color:var(--sub);font-size:11.5px;margin-top:2px}
.fbtn{border:1px solid var(--line);background:var(--chip);color:var(--accent);border-radius:9px;
  padding:5px 10px;font-size:11.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.fbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.arts{margin-top:9px;display:flex;flex-direction:column;gap:2px}
.art{display:flex;align-items:baseline;gap:8px;padding:8px 4px;border-top:1px solid var(--line);
  color:var(--text);text-decoration:none;font-size:13px}
.art:hover{color:var(--accent)}
.art .ad{color:var(--sub);font-size:11px;font-variant-numeric:tabular-nums;flex:none}
.art .at{flex:1;min-width:0}
.art .asrc{flex:none;color:var(--sub);font-size:10.5px;opacity:.7;white-space:nowrap}
.fchips{display:flex;gap:6px;overflow-x:auto;padding:10px 2px}
.fchip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--sub);
  border-radius:16px;padding:5px 13px;font-size:12px;font-weight:600;cursor:pointer}
.fchip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.artlist{background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:4px 12px 8px;box-shadow:var(--shadow)}
.newb{display:inline-block;background:linear-gradient(90deg,var(--accent),var(--accent2));
  color:#fff;font-size:9.5px;font-weight:700;border-radius:5px;
  padding:0 5px;margin-left:6px;vertical-align:1px}
/* chart popup */
.cbtn{border:1px solid var(--line);background:var(--chip);border-radius:8px;font-size:12px;
  padding:2px 7px;cursor:pointer;margin-left:6px;vertical-align:1px;color:var(--sub)}
.wbtn.on{color:#f59e0b;border-color:#f59e0b;background:rgba(245,158,11,.1)}
#wbadge{display:inline-block;background:var(--bad);color:#fff;font-size:10px;font-weight:700;
  border-radius:9px;padding:0 6px;margin-left:4px;vertical-align:1px}
#wbadge:empty{display:none}
#chartpop{position:fixed;z-index:60;width:338px;max-width:94vw;background:var(--card);
  border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 40px rgba(8,20,40,.25);
  padding:12px;display:none}
#chartpop.show{display:block}
#chartpop .cph{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;
  font-weight:700;margin-bottom:4px}
#chartpop .cpd{color:var(--sub);font-size:10.5px;font-weight:400}
#chartpop .cpx{border:0;background:none;color:var(--sub);font-size:15px;cursor:pointer;padding:0 2px}
/* deep dive viewer */
#deepview{position:fixed;inset:0;z-index:70;background:var(--bg);display:none;overflow-y:auto}
#deepview.show{display:block}
#deepview .dvh{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--line);
  padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
#deepview .dvh b{font-size:16px}
#deepview .dvx{border:1px solid var(--line);background:var(--chip);color:var(--text);
  border-radius:9px;padding:5px 12px;font-size:13px;cursor:pointer}
.mdc{max-width:760px;margin:0 auto;padding:16px 18px 60px;font-size:14px;line-height:1.8}
.mdc h3{font-size:16px;margin:22px 0 6px;color:var(--accent)}
.mdc p{margin:8px 0}
.mdc li{margin:3px 0 3px 18px}
.mdc a{color:var(--accent)}
.dchips{display:flex;gap:6px;flex-wrap:wrap}
.dchip{background:var(--chip);border:1px solid var(--line);border-radius:8px;
  padding:2px 9px;font-size:11.5px;font-weight:600}
.gmini{display:inline-block;background:var(--chip);border-radius:6px;padding:1px 7px;
  font-size:10.5px;font-weight:700;margin:0 3px 0 0}
/* trade note */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:10px 12px;box-shadow:var(--shadow)}
.tile .tl{font-size:11px;color:var(--sub)}
.tile .tv{font-size:21px;font-weight:700;margin-top:2px}
.tile .ts{font-size:10.5px;color:var(--sub);margin-top:1px}
.chartcard{background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:12px 14px;box-shadow:var(--shadow)}
.chartcard .ct{font-weight:700;font-size:13.5px;margin-bottom:6px}
.ttable{width:100%;border-collapse:collapse;font-size:12.5px}
.ttable th{text-align:left;color:var(--sub);font-weight:600;font-size:11px;
  padding:4px 6px;border-bottom:1px solid var(--line)}
.ttable td{padding:6px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.ttable td.num,.ttable th.num{text-align:right}
.trow{cursor:pointer}
.memo{width:100%;box-sizing:border-box;margin-top:6px;padding:7px 10px;border:1px solid var(--line);
  border-radius:9px;background:var(--bg);color:var(--text);font-size:12.5px;font-family:inherit}
</style>
</head>

<nav id="drawer">

<header>

  <input id="q" type="search" placeholder="銘柄名・コード・業種で絞り込み">

<script>
let DATA=null, ANALYSIS=null, ARTICLES=null, COMMENTS=null, CHARTS=null, view='sougou';
let hoverTimer=null;
const MAS=[[5,'#10b981'],[25,'#f59e0b'],[50,'#8b5cf6'],[100,'#ec4899'],[200,'#64748b']];
function maSeries(cAll,off,n,period){
  const out=[];
  for(let i=0;i<n;i++){const gi=off+i;
    if(gi<period-1){out.push(null);continue;}
    let s=0;for(let j=gi-period+1;j<=gi;j++)s+=cAll[j];
    out.push(s/period);}
  return out;
}
function svgChart(s,N){
  const W=312,H=150,P=4;
  const cAll=s.c;
  const off=Math.max(0,cAll.length-N);
  const c=cAll.slice(-N);
  const hasOHLC=s.o&&s.o.length>=N;
  const o=hasOHLC?s.o.slice(-N):c, h=hasOHLC?s.h.slice(-N):c, l=hasOHLC?s.l.slice(-N):c;
  const mas=MAS.map(([p,col])=>[maSeries(cAll,off,N,p),col]);
  const maVals=mas.flatMap(([m])=>m.filter(v=>v!==null));
  const mn=Math.min(...l,...maVals),mx=Math.max(...h,...maVals),rg=(mx-mn)||1;
  const X=i=>P+(W-2*P)*(i+0.5)/N, Y=v=>H-P-(H-2*P)*(v-mn)/rg;
  const bw=Math.max(1.2,(W-2*P)/N*0.62);
  let candles='';
  for(let i=0;i<N;i++){
    const up=c[i]>=o[i], col=up?'#ef4444':'#3b82f6';
    const x=X(i);
    const top=Y(Math.max(o[i],c[i])), bot=Y(Math.min(o[i],c[i]));
    candles+=`<line x1="${x.toFixed(1)}" y1="${Y(h[i]).toFixed(1)}" x2="${x.toFixed(1)}" y2="${Y(l[i]).toFixed(1)}" stroke="${col}" stroke-width="0.7"/>`;
    candles+=`<rect x="${(x-bw/2).toFixed(1)}" y="${top.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0.8,bot-top).toFixed(1)}" fill="${up?col:col}" ${up?'fill-opacity="0.95"':''}/>`;
  }
  const lines=mas.map(([m,col])=>{
    const pts=[];m.forEach((v,i)=>{if(v!==null)pts.push(`${X(i).toFixed(1)},${Y(v).toFixed(1)}`)});
    return pts.length>1?`<polyline points="${pts.join(' ')}" fill="none" stroke="${col}" stroke-width="1" opacity=".9"/>`:'';
  }).join('');
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${candles}${lines}</svg>`;
}
function showChart(code4,name,anchor,ev){
  if(ev)ev.stopPropagation();
  const pop=document.getElementById('chartpop');
  const s=CHARTS&&CHARTS.series&&CHARTS.series[code4];
  if(!s){pop.classList.remove('show');return;}
  const N=Math.min(122,s.c.length);           // 約6ヶ月(営業日)
  const c=s.c.slice(-N),chg=((c[c.length-1]/c[0]-1)*100).toFixed(1);
  const legend=MAS.map(([p,col])=>`<span style="color:${col}">─${p}日</span>`).join(' ');
  pop.innerHTML=`<div class="cph"><span>${name} <span class="cpd">${code4}</span></span>
    <span><span class="${chg>=0?'pos':'neg'}">${chg>=0?'+':''}${chg}%</span>
    <span class="cpd"> 6ヶ月</span> <button class="cpx" onclick="hideChart()">✕</button></span></div>
    ${svgChart(s,N)}
    <div class="cpd" style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:2px"><span>${legend}</span><span>終値 ${c[c.length-1].toLocaleString()}円 ・ ${s.e}</span></div>`;
  const r=anchor.getBoundingClientRect();
  const w=Math.min(320,window.innerWidth*0.92);
  let x=Math.min(r.left,window.innerWidth-w-8), y=r.bottom+8;
  if(y+190>window.innerHeight)y=Math.max(8,r.top-190);
  pop.style.left=Math.max(8,x)+'px'; pop.style.top=y+'px';
  pop.classList.add('show');
}
function hideChart(){document.getElementById('chartpop').classList.remove('show');}
function hoverChart(code4,name,el){
  if(!window.matchMedia('(hover: hover)').matches)return;
  clearTimeout(hoverTimer);
  hoverTimer=setTimeout(()=>showChart(code4,name,el),180);
}
function unhoverChart(){clearTimeout(hoverTimer);hoverTimer=setTimeout(hideChart,250);}
document.addEventListener('click',e=>{
  const pop=document.getElementById('chartpop');
  if(pop.classList.contains('show')&&!pop.contains(e.target)&&!e.target.classList.contains('cbtn'))hideChart();
});
const VT={sougou:'総合(三式ミックス)',niokutameo:'弐億貯男式',kiyohara:'清原式',
          dividend:'配当バリュー成長',kabuzaru:'株猿式 (10基準)',duke:'DUKE式 (新高値)',analysis:'A〜E分析',articles:'記事',watch:'ウォッチリスト',trades:'トレードノート'};
let TRADES=null, TCH=null;
function localFills(){try{return JSON.parse(localStorage.getItem('localFills')||'[]')}catch(e){return []}}
function fillKey(f){return `${f.broker}|${f.date}|${f.code4}|${f.side}|${f.qty}|${f.price}|${f.seq||0}`}
function allFills(){
  const seen=new Set(),out=[];
  for(const f of [...(TRADES&&TRADES.fills||[]),...localFills()]){
    const k=fillKey(f); if(seen.has(k))continue; seen.add(k); out.push(f);
  }
  return out;
}
function jhash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return (h>>>0).toString(16)}
function parseCsvText(text){
  const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cell+='"';i++;}else q=false;}else cell+=ch;}
    else if(ch==='"')q=true;
    else if(ch===',' ){row.push(cell);cell='';}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cell);cell='';if(row.some(c=>c.trim()!==''))rows.push(row);row=[];}
    else cell+=ch;}
  if(cell!==''||row.length){row.push(cell);if(row.some(c=>c.trim()!==''))rows.push(row);}
  return rows;
}
const CSVCAND={date:['約定日','約定日時','国内約定日','取引日','受渡日'],name:['銘柄名','銘柄','ファンド名'],
  code:['銘柄コード','証券コード','コード'],side:['取引','売買','取引区分','売買区分','取引種類'],
  qty:['約定数量','数量','出来数量','約定株数','株数'],price:['約定単価','単価','約定価格','平均約定単価'],
  fee:['手数料','諸経費'],tax:['税額','税金','課税額'],account:['預り区分','口座区分','口座','預り']};
function csvNorm(s){return (s||'').normalize('NFKC').trim()}
function csvNum(s){s=csvNorm(s).replace(/[,円株]/g,'').replace(/[^\d.\-]/g,'');const v=parseFloat(s);return isFinite(v)?v:null}
function parseBrokerCsv(text,broker){
  const rows=parseCsvText(text);
  let hi=-1,header=null;
  for(let i=0;i<Math.min(rows.length,30);i++){
    const j=rows[i].map(csvNorm).join('');
    if((j.includes('約定日')||j.includes('取引日'))&&(j.includes('銘柄')||j.includes('ファンド'))&&(j.includes('数量')||j.includes('株数'))){hi=i;header=rows[i].map(csvNorm);break;}
  }
  if(hi<0)return {fills:[],err:'ヘッダ行が見つかりません'};
  const idx={};
  for(const[k,cands]of Object.entries(CSVCAND)){idx[k]=null;
    outer:for(const c of cands)for(let i=0;i<header.length;i++)if(header[i].includes(c)){idx[k]=i;break outer;}}
  const fills=[];
  const seqM={}; // 同条件の実約定(PTS同値約定など)をファイル内連番で区別
  for(const row of rows.slice(hi+1)){
    const get=k=>idx[k]!==null&&idx[k]<row.length?csvNorm(row[idx[k]]):'';
    const dm=get('date').match(/(\d{4})[\/\-年](\d{1,2})[\/\-月](\d{1,2})/);
    const date=dm?`${dm[1]}-${String(dm[2]).padStart(2,'0')}-${String(dm[3]).padStart(2,'0')}`:null;
    const sv=get('side');const side=sv.includes('買')?'buy':(sv.includes('売')?'sell':null);
    const qty=csvNum(get('qty')),price=csvNum(get('price'));
    const cm=(get('code')+' '+get('name')).match(/\b(\d{3}[0-9A-Z])\b/);
    if(!(date&&side&&qty&&price&&cm))continue;
    const f={broker,date,code4:cm[1],name:get('name').replace(/\b\d{3}[0-9A-Z]\b/,'').trim()||null,
      side,qty,price,fee:(csvNum(get('fee'))||0)+(csvNum(get('tax'))||0),account:get('account')||null};
    const bk=`${f.broker}|${f.date}|${f.code4}|${f.side}|${f.qty}|${f.price}`;
    const sn=seqM[bk]||0;seqM[bk]=sn+1;if(sn)f.seq=sn;
    f.id='L'+jhash(fillKey(f));
    fills.push(f);
  }
  return {fills,err:null};
}
async function doImport(){
  const inp=document.getElementById('csvIn'),broker=document.getElementById('brokerSel').value;
  const msg=document.getElementById('impMsg');
  if(!inp.files.length){msg.textContent='CSVファイルを選択してください';return;}
  let added=0,total=0,errs=[];
  const local=localFills(); const known=new Set([...allFills().map(fillKey)]);
  for(const file of inp.files){
    const buf=await file.arrayBuffer();
    let text=new TextDecoder('shift_jis').decode(buf);
    const utf=new TextDecoder().decode(buf);
    if((text.match(/�/g)||[]).length>(utf.match(/�/g)||[]).length)text=utf;
    const r=parseBrokerCsv(text,broker);
    if(r.err){errs.push(`${file.name}: ${r.err}`);continue;}
    total+=r.fills.length;
    for(const f of r.fills){const k=fillKey(f);if(!known.has(k)){known.add(k);local.push(f);added++;}}
  }
  try{localStorage.setItem('localFills',JSON.stringify(local))}catch(e){errs.push('保存失敗(容量?)')}
  render();
  const m2=document.getElementById('impMsg');
  if(m2)m2.textContent=`${added}件を追加しました(読取${total}件・重複除外${total-added}件)`+(errs.length?` ⚠${errs.join(' / ')}`:'');
}

function tradeChartSvg(t,fills){
  const s=TCH&&TCH[t.code4];
  if(!s)return '<div class="hist" style="margin-top:6px">この銘柄のチャートデータは次回更新時に生成されます</div>';
  let i0=s.d.findIndex(d=>d>=t.first),i1=s.d.findIndex(d=>d>=t.date);
  if(i1<0)i1=s.d.length-1; if(i0<0)i0=0;
  i0=Math.max(0,i0-15); i1=Math.min(s.d.length-1,i1+15);
  if(i1-i0<3)return '<div class="hist" style="margin-top:6px">チャート期間のデータ不足(取引が古い可能性)</div>';
  const d=s.d.slice(i0,i1+1),o=s.o.slice(i0,i1+1),h=s.h.slice(i0,i1+1),l=s.l.slice(i0,i1+1),c=s.c.slice(i0,i1+1);
  const W=312,H=150,P=6,N=d.length;

  const X=i=>P+(W-2*P)*(i+0.5)/N,Y=v=>H-P-(H-2*P)*(v-mn)/rg;

  let sv='';
  for(let i=0;i<N;i++){
    const up=c[i]>=o[i],col=up?'#ef4444':'#3b82f6',x=X(i);
    const top=Y(Math.max(o[i],c[i])),bot=Y(Math.min(o[i],c[i]));
    sv+=`<line x1="${x.toFixed(1)}" y1="${Y(h[i]).toFixed(1)}" x2="${x.toFixed(1)}" y2="${Y(l[i]).toFixed(1)}" stroke="${col}" stroke-width="0.7"/>`;
    sv+=`<rect x="${(x-bw/2).toFixed(1)}" y="${top.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0.8,bot-top).toFixed(1)}" fill="${col}"/>`;
  }
  for(const f of fills){
    if(f.date<d[0]||f.date>d[N-1])continue;
    let idx=d.indexOf(f.date);
    if(idx<0){idx=d.findIndex(x=>x>f.date);if(idx<0)continue;}
    const x=X(idx);
    if(f.side==='buy'){const y=Y(l[idx])+11;
      sv+=`<polygon points="${x},${y-6} ${x-5},${y+3} ${x+5},${y+3}" fill="var(--accent)" stroke="var(--card)" stroke-width="1.5"><title>買 ${f.date} ${f.qty}株 @${f.price}</title></polygon>`;
    }else{const y=Y(h[idx])-11;
      sv+=`<polygon points="${x},${y+6} ${x-5},${y-3} ${x+5},${y-3}" fill="#f59e0b" stroke="var(--card)" stroke-width="1.5"><title>売 ${f.date} ${f.qty}株 @${f.price}</title></polygon>`;
    }
  }
  return `<div style="margin-top:8px"><svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${sv}</svg>
  <div class="cd" style="display:flex;justify-content:space-between"><span>${d[0]}</span><span><span style="color:var(--accent)">▲</span>買い <span style="color:#f59e0b">▼</span>売り</span><span>${d[N-1]}</span></div></div>`;
}
function aggTrades(fills){
  const bySort=[...fills].sort((a,b)=>a.date.localeCompare(b.date)||a.side.localeCompare(b.side));
  const pos={}, closed=[];
  for(const f of bySort){
    const p=pos[f.code4]||(pos[f.code4]={qty:0,cost:0,first:f.date,name:f.name,brokers:new Set()});
    p.brokers.add(f.broker); if(f.name)p.name=f.name;
    if(f.side==='buy'){
      p.cost=p.cost+f.price*f.qty+(f.fee||0); p.qty+=f.qty;
      if(p.qty===f.qty)p.first=f.date;
    }else{
      const q=Math.min(f.qty,p.qty);
      if(q<=0)continue;
      const avg=p.qty>0?p.cost/p.qty:f.price;
      const pnl=(f.price*q-(f.fee||0))-avg*q;
      const hold=Math.max(1,Math.round((new Date(f.date)-new Date(p.first))/86400000));
      closed.push({id:f.id,date:f.date,code4:f.code4,name:p.name||f.name,qty:q,first:p.first,
        sell:f.price,avg:Math.round(avg*10)/10,pnl:Math.round(pnl),hold,broker:f.broker});
      p.cost-=avg*q; p.qty-=q;
      if(p.qty<=0){p.qty=0;p.cost=0;}
    }
  }
  const open=Object.entries(pos).filter(([,p])=>p.qty>0).map(([c,p])=>({
    code4:c,name:p.name,qty:p.qty,avg:Math.round(p.cost/p.qty*10)/10,first:p.first}));
  const wins=closed.filter(t=>t.pnl>0),losses=closed.filter(t=>t.pnl<0);
  const sum=a=>a.reduce((s,t)=>s+t.pnl,0);
  const monthly={};
  closed.forEach(t=>{const m=t.date.slice(0,7);monthly[m]=(monthly[m]||0)+t.pnl;});
  const byStock={};
  closed.forEach(t=>{const b=byStock[t.code4]||(byStock[t.code4]={name:t.name,n:0,w:0,pnl:0});
    b.n++;if(t.pnl>0)b.w++;b.pnl+=t.pnl;});
  return {closed:closed.reverse(),open,monthly,byStock,
    total:sum(closed),wins:wins.length,n:closed.length,
    avgWin:wins.length?sum(wins)/wins.length:0,
    avgLoss:losses.length?sum(losses)/losses.length:0};
}
function monthlyChart(monthly){
  const keys=Object.keys(monthly).sort().slice(-12);
  if(!keys.length)return '';
  const vals=keys.map(k=>monthly[k]);
  const W=Math.min(560,window.innerWidth-60),H=170,P={t:14,b:20,l:8,r:8};
  const mx=Math.max(...vals,0),mn=Math.min(...vals,0),rg=(mx-mn)||1;
  const Y=v=>P.t+(H-P.t-P.b)*(mx-v)/rg;
  const y0=Y(0);
  const slot=(W-P.l-P.r)/keys.length;
  const bw=Math.min(24,slot-2);
  // きりのいい目盛り
  const step=Math.pow(10,Math.floor(Math.log10(rg)))* (rg/Math.pow(10,Math.floor(Math.log10(rg)))>5?2:1);
  let grid='';
  for(let v=Math.ceil(mn/step)*step;v<=mx;v+=step){
    grid+=`<line x1="${P.l}" x2="${W-P.r}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="var(--line)" stroke-width="1"/>`;
  }
  const iMax=vals.indexOf(Math.max(...vals)),iMin=vals.indexOf(Math.min(...vals));
  let bars='';
  keys.forEach((k,i)=>{
    const v=vals[i],x=P.l+slot*i+(slot-bw)/2;
    const top=Math.min(Y(v),y0),h=Math.max(1.5,Math.abs(Y(v)-y0));
    const col=v>=0?'var(--good)':'var(--bad)';
    const r=Math.min(4,h);
    // データ側の端のみ4px丸め・ベースライン側は直角
    const d=v>=0
      ?`M${x},${y0} V${top+r} Q${x},${top} ${x+r},${top} H${x+bw-r} Q${x+bw},${top} ${x+bw},${top+r} V${y0} Z`
      :`M${x},${y0} V${top+h-r} Q${x},${top+h} ${x+r},${top+h} H${x+bw-r} Q${x+bw},${top+h} ${x+bw},${top+h-r} V${y0} Z`;
    bars+=`<path d="${d}" fill="${col}"><title>${k}: ${v>=0?'+':''}${v.toLocaleString()}円</title></path>`;
    if(i===iMax||i===iMin||i===keys.length-1){
      const ly=v>=0?top-4:top+h+11;
      bars+=`<text x="${x+bw/2}" y="${ly.toFixed(1)}" text-anchor="middle" font-size="9.5" fill="var(--sub)">${(v/10000).toFixed(0)}万</text>`;
    }
    bars+=`<text x="${x+bw/2}" y="${H-6}" text-anchor="middle" font-size="9" fill="var(--sub)">${k.slice(5)}月</text>`;
  });
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${grid}
    <line x1="${P.l}" x2="${W-P.r}" y1="${y0.toFixed(1)}" y2="${y0.toFixed(1)}" stroke="var(--sub)" stroke-width="1"/>
    ${bars}</svg>`;
}

function mdToHtml(md){
  const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
  const lines=(md||'').split('\n');
  let h='',inList=false;
  for(let ln of lines){
    let t=esc(ln.trim());
    t=t.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')
       .replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
    if(/^#{1,4}\s/.test(t)){if(inList){h+='</ul>';inList=false;}h+=`<h3>${t.replace(/^#+\s*/,'')}</h3>`;}
    else if(/^[-・]\s/.test(t)){if(!inList){h+='<ul>';inList=true;}h+=`<li>${t.replace(/^[-・]\s*/,'')}</li>`;}
    else if(t===''){if(inList){h+='</ul>';inList=false;}}
    else{if(inList){h+='</ul>';inList=false;}h+=`<p>${t}</p>`;}
  }
  if(inList)h+='</ul>';
  return h;
}

    ${r.netcash_cons!==null&&r.netcash_cons!==undefined?`<span class="kv"><span class="l">保守NC</span> <b>${r.netcash_cons}%</b></span>`:(r.netcash_ratio!==null&&r.netcash_ratio!==undefined?`<span class="kv"><span class="l">NC比率</span> <b>${r.netcash_ratio}%</b></span>`:'')}

  <div class="chips">${chips(r)}</div>
  ${miniGrades(r.code4)}${deepChips(r.code4)}
  <div class="detail">
    <div>売上CAGR3y <b>${fmt(r.sales_cagr3,'%')}</b> ・ 営利CAGR3y <b>${fmt(r.op_cagr3,'%')}</b> ・ 営利率 <b>${fmt(r.op_margin,'%')}</b> ・ 自己資本比率 <b>${fmt(r.eqar,'%')}</b></div>
    <div>配当 <b>${fmt(r.dps,'円')}</b> ・ 配当性向 <b>${fmt(r.payout,'%')}</b>${r.seisan_oku!==null&&r.seisan_oku!==undefined?` ・ 清算価値 <b>${yen(r.seisan_oku)}</b>`:''}</div>
    <div class="hist">EPS推移: ${r.eps_hist&&r.eps_hist.length?r.eps_hist.join(' → '):'—'}</div>
    <div class="hist">配当推移: ${r.dps_hist&&r.dps_hist.length?r.dps_hist.join(' → '):'—'}</div>
    <div class="hist">売上(億): ${r.sales_hist&&r.sales_hist.length?r.sales_hist.join(' → '):'—'} ・ 営利(億): ${r.op_hist&&r.op_hist.length?r.op_hist.join(' → '):'—'}</div>
    ${r.sg_arc!==null&&r.sg_arc!==undefined?`<div class="hist">総合内訳: A〜E評価 ${r.sg_arc} ・ 成長 ${r.sg_growth} ・ 割安 ${r.sg_value} ・ 資産 ${r.sg_asset} (各100点満点)</div>`:''}
    ${r.q_type?`<div class="hist">直近四半期(${r.q_type}累計): 営利 ${fmt(r.q_op_oku,'億')}${r.f_op_oku&&r.q_op_oku>0?` ・ 通期予想${r.f_op_oku}億に対し進捗${Math.round(r.q_op_oku/r.f_op_oku*100)}%`:''}</div>`:''}
    ${commentBlock(r.code4)}
    <div class="links" style="margin-top:6px">
      ${deepLink(r.code4,r.name)}
      <a href="${kab}" target="_blank" rel="noopener">株探</a>
      <a href="${buf}" target="_blank" rel="noopener">バフェットコード</a>
      <a href="https://kabuyoho.ifis.co.jp/index.php?action=tp1&sa=report&bcode=${r.code4}" target="_blank" rel="noopener">アナリスト予想</a>
      <a href="https://www.tradingview.com/chart/?symbol=TSE%3A${r.code4}" target="_blank" rel="noopener">チャート</a>
    </div>
  </div></div>`;
}
const GLABELS=['①資産','②収益割安','③財務','④収益性','⑤成長','⑦還元'];
function gradeChips(g){
  const keys=['asset','earnings','health','profit','growth','payout'];
  return '<div class="grades">'+keys.map((k,i)=>{
    const v=g[k]||'—';
    return `<span class="gr"><span class="gl">${GLABELS[i]}</span><span class="gv g${v}">${v}</span></span>`;
  }).join('')+'</div>';
}
function analysisCard(r,i){
  const kab=`https://kabutan.jp/stock/?code=${r.code4}`;
  const buf=`https://www.buffett-code.com/company/${r.code4}/`;
  const danger=r.danger&&r.danger.length?`<div class="chips">${r.danger.map(d=>`<span class="chip b">⚠${d}</span>`).join('')}</div>`:'';
  return `<div class="card" onclick="if(event.target.tagName!=='A')this.classList.toggle('open')">
  <div class="row1"><div class="nm" onmouseenter="hoverChart('${r.code4}','${(r.name||'').replace(/'/g,'')}',this)" onmouseleave="unhoverChart()">${i+1}. ${r.name||''}${r.is_new?'<span class="newb">NEW</span>':''}<span class="cd">${r.code4} ・ ${r.sector||''}</span><button class="cbtn" onclick="showChart('${r.code4}','${(r.name||'').replace(/'/g,'')}',this,event)">📈</button><button class="cbtn wbtn ${isWatched(r.code4)?'on':''}" onclick="toggleWatch('${r.code4}',event)">★</button></div>
    <div class="score">${r.composite}</div></div>
  ${gradeChips(r.grades)}
  ${danger}
  ${deepChips(r.code4)}
  <div class="detail">
    <div>時価総額 <b>${yen(r.mcap_oku)}</b> ・ PER <b>${fmt(r.per)}</b> ・ PBR <b>${fmt(r.pbr)}</b> ・ 利回り <b>${fmt(r.yield,'%')}</b></div>
    <div>清算価値 <b>${yen(r.seisan_oku)}</b>${r.seisan_oku!==null&&r.mcap_oku&&r.mcap_oku<r.seisan_oku?' <span class="pos">(時価総額が清算価値を下回る)</span>':''} ・ NC比率 <b>${fmt(r.netcash_ratio,'%')}</b></div>
    <div>DCFレンジ: 弱気 <b>${yen(r.dcf_weak_oku)}</b> 〜 強気 <b>${yen(r.dcf_strong_oku)}</b> (対 時価総額 ${yen(r.mcap_oku)})</div>
    <div class="hist">EDINET期末: ${r.edinet_end||'—'} ・ Aが1つでもあれば買材料(手順§5)。⑥事業素質は定性のため未採点</div>
    ${commentBlock(r.code4)}
    <div class="links" style="margin-top:6px">
      ${deepLink(r.code4,r.name)}
      <a href="${kab}" target="_blank" rel="noopener">株探</a>
      <a href="${buf}" target="_blank" rel="noopener">バフェットコード</a>
    </div>
  </div></div>`;
}
let artFilter='all';
function setArtFilter(id){artFilter=id;render();}
function artRow(a){
  return `<a class="art" href="${a.url}" target="_blank" rel="noopener">
    <span class="ad">${(a.date||'').slice(5)}</span>
    <span class="at">${a.title}${a.new?'<span class="newb">NEW</span>':''}</span>
    <span class="asrc">${a.fl||''}</span></a>`;
}
function candBlock(f){
  const items=(f.items||[]).slice(0,3).map(a=>
    `<a class="art" href="${a.url}" target="_blank" rel="noopener"><span class="ad">${(a.date||'').slice(5)}</span><span class="at">${a.title}</span></a>`).join('');
  return `<div class="feed">
    <div class="fhead"><div><div class="fttl">${f.label}</div><div class="fdesc">${f.desc||''}</div></div>
    <button class="fbtn" onclick="togglePromote('${f.id}')">☆ よく見るへ</button></div>
    <div class="arts">${items||`<div class="empty" style="padding:12px">自動リスト化できないサイト。リンクから直接どうぞ。</div>`}</div>
    <div class="links" style="margin-top:8px"><a href="${f.home}" target="_blank" rel="noopener">サイトで一覧を開く →</a></div>
  </div>`;
}
function renderArticles(){
  document.getElementById('toolbar').style.display='none';
  document.getElementById('note').textContent='';
  if(!ARTICLES){document.getElementById('list').innerHTML='<div class="empty">記事データはまだありません(次回更新で表示されます)</div>';return;}
  const p=promoted();
  const included=ARTICLES.feeds.filter(f=>f.kind==='watch'||p.has(f.id));
  const cand=ARTICLES.feeds.filter(f=>f.kind==='candidate'&&!p.has(f.id));
  let items=[];
  included.forEach(f=>(f.items||[]).forEach(a=>items.push({...a,fid:f.id,fl:f.short||f.label})));
  items.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  if(artFilter!=='all'&&included.some(f=>f.id===artFilter))
    items=items.filter(a=>a.fid===artFilter);
  const chips=`<div class="fchips">
    <button class="fchip ${artFilter==='all'?'on':''}" onclick="setArtFilter('all')">すべて</button>
    ${included.map(f=>`<button class="fchip ${artFilter===f.id?'on':''}" onclick="setArtFilter('${f.id}')">${f.short||f.label}${f.kind==='candidate'?' ★':''}</button>`).join('')}
  </div>`;
  let h=chips;
  h+=`<div class="artlist">${items.length?items.map(artRow).join(''):'<div class="empty">記事がありません</div>'}</div>`;
  const cur=included.find(f=>f.id===artFilter);
  if(cur)h+=`<div class="links" style="padding:4px 6px"><a href="${cur.home}" target="_blank" rel="noopener">${cur.label} をサイトで開く →</a>${cur.kind==='candidate'?` <a href="javascript:void(0)" onclick="togglePromote('${cur.id}')">★解除して候補に戻す</a>`:''}</div>`;
  if(cand.length){
    h+=`<div class="dttl" style="padding:14px 6px 4px">記事候補 (☆でよく見るへ追加)</div>`;
    h+=cand.map(candBlock).join('');
  }
  document.getElementById('list').innerHTML=h;
}
function watchCard(code,i){
  const u=(UNIVERSE||{})[code]||{};
  const a=alertMap()[code];
  const name=(u.n||code);
  const chips=a?`<div class="chips">${a.flags.map(f=>`<span class="chip ${f.includes('急落')?'b':'g'}">⚡${f}</span>`).join('')}</div>`:'';
  return `<div class="card">
  <div class="row1"><div class="nm" onmouseenter="hoverChart('${code}','${name.replace(/'/g,'')}',this)" onmouseleave="unhoverChart()">${name}<span class="cd">${code} ・ ${u.s||''}</span><button class="cbtn" onclick="showChart('${code}','${name.replace(/'/g,'')}',this,event)">📈</button><button class="cbtn wbtn on" onclick="toggleWatch('${code}',event)">★</button></div>
    <div class="score">${a&&a.chg!==undefined?(a.chg>=0?'+':'')+a.chg+'%':''}</div></div>
  <div class="row2">
    <span class="kv"><span class="l">株価</span> <b>${fmt(u.p)}</b></span>
    <span class="kv"><span class="l">時価総額</span> <b>${yen(u.m)}</b></span>
    <span class="kv"><span class="l">PER</span> <b>${fmt(u.per)}</b></span>
    <span class="kv"><span class="l">PBR</span> <b>${fmt(u.pbr)}</b></span>
    <span class="kv"><span class="l">利回り</span> <b>${fmt(u.y,'%')}</b></span>
    <span class="kv"><span class="l">ROE</span> <b>${fmt(u.roe,'%')}</b></span>
  </div>
  ${chips}
  ${miniGrades(code)}${deepChips(code)}
  <div class="links" style="margin-top:7px">
    ${deepLink(code,name)}
    <a href="https://kabutan.jp/stock/?code=${code}" target="_blank" rel="noopener">株探</a>
    <a href="https://kabuyoho.ifis.co.jp/index.php?action=tp1&sa=report&bcode=${code}" target="_blank" rel="noopener">アナリスト予想</a>
    <a href="https://www.buffett-code.com/company/${code}/" target="_blank" rel="noopener">バフェットコード</a>
    <a href="https://www.tradingview.com/chart/?symbol=TSE%3A${code}" target="_blank" rel="noopener">チャート</a>
  </div></div>`;
}
function renderWatch(){
  document.getElementById('toolbar').style.display='none';
  document.getElementById('note').textContent='各リストの銘柄カードの★を押すとここに追加されます(この端末に保存)。⚡は当日のイベント(開示・±5%・52週高値・ゴールデンクロス)。';
  const l=watchList();
  if(!l.length){document.getElementById('list').innerHTML='<div class="empty">まだウォッチ銘柄がありません。<br>スクリーニングの銘柄カードにある ★ をタップして追加してください。</div>';return;}
  if(!UNIVERSE){
    document.getElementById('list').innerHTML='<div class="empty">読み込み中…</div>';
    fetch('data/universe.json?'+Date.now()).then(r=>r.ok?r.json():{}).then(u=>{UNIVERSE=u;if(view==='watch')render();}).catch(()=>{UNIVERSE={};if(view==='watch')render();});
    return;
  }
  const am=alertMap();
  const sorted=[...l].sort((a,b)=>(am[b]?1:0)-(am[a]?1:0));
  document.getElementById('list').innerHTML=sorted.map(watchCard).join('')
    +(ALERTS&&ALERTS.as_of?`<div class="note" style="padding:4px 6px">イベント判定基準日: ${ALERTS.as_of}</div>`:'');
}
function render(){
  document.querySelectorAll('.mi[data-v]').forEach(e=>e.classList.toggle('active',e.dataset.v===view));
  document.getElementById('vtitle').textContent=VT[view]||'ファンダ・ラボ';
  if(view==='watch'){renderWatch();document.getElementById('count').textContent='';return;}
  if(view==='kabuzaru'){renderKabu();return;}
  if(view==='duke'){renderDuke();return;}
  if(view==='trades'){renderTrades();document.getElementById('count').textContent='';return;}
  if(view==='articles'){renderArticles();document.getElementById('count').textContent='';return;}
  document.getElementById('toolbar').style.display='';
  const q=document.getElementById('q').value.trim().toLowerCase();
  if(view==='analysis'){
    if(!ANALYSIS){document.getElementById('list').innerHTML='<div class="empty">A〜E分析データはまだありません(EDINET初回取得後に表示されます)</div>';document.getElementById('count').textContent='';return;}
    let items=ANALYSIS.items;
    if(q)items=items.filter(r=>((r.name||'')+(r.code4||'')+(r.sector||'')).toLowerCase().includes(q));
    document.getElementById('count').textContent=`${items.length}件`;
    document.getElementById('note').textContent=ANALYSIS.note||'';
    document.getElementById('list').innerHTML=
      items.length?items.map(analysisCard).join(''):'<div class="empty">該当なし</div>';
    return;
  }
  if(!DATA)return;
  const s=DATA.screens[view]||{items:[],count:0};
  let items=s.items;
  if(q)items=items.filter(r=>((r.name||'')+(r.code4||'')+(r.sector||'')).toLowerCase().includes(q));
  document.getElementById('count').textContent=`${items.length}/${s.count}件`;
  document.getElementById('note').textContent=(DATA.notes&&DATA.notes[view])?DATA.notes[view]:'';
  document.getElementById('list').innerHTML=
    items.length?items.map(card).join(''):'<div class="empty">条件に合致する銘柄がありません</div>';
}
function go(v){view=v;toggleMenu(false);render();window.scrollTo(0,0);}
fetch('data/latest.json?'+Date.now()).then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{
  DATA=d;
  document.getElementById('asof').textContent=
    `データ基準日 ${d.as_of||'—'} ・ 更新 ${d.generated_at||'—'} ・ 対象 ${d.universe}銘柄`;
  render();
}).catch(()=>{
  document.getElementById('asof').textContent='初回データ生成待ち';
  document.getElementById('list').innerHTML='<div class="empty">まだデータがありません。</div>';
});
fetch('data/analysis.json?'+Date.now()).then(r=>r.ok?r.json():null).then(a=>{ANALYSIS=a;render();}).catch(()=>{});
fetch('data/deep/index.json?'+Date.now()).then(r=>r.ok?r.json():null).then(d=>{DEEP=d;render();}).catch(()=>{});
fetch('data/kabuzaru.json?'+Date.now()).then(r=>r.ok?r.json():null).then(k=>{KABU=k;if(view==='kabuzaru')render();}).catch(()=>{});
fetch('data/duke.json?'+Date.now()).then(r=>r.ok?r.json():null).then(k=>{DUKE=k;if(view==='duke')render();}).catch(()=>{});
fetch('data/trades.json?'+Date.now()).then(r=>r.ok?r.json():null).then(t=>{TRADES=t;if(view==='trades')render();}).catch(()=>{});
fetch('data/trade_charts.json?'+Date.now()).then(r=>r.ok?r.json():null).then(t=>{TCH=t;if(view==='trades')render();}).catch(()=>{});
fetch('data/articles.json?'+Date.now()).then(r=>r.ok?r.json():null).then(a=>{ARTICLES=a;if(view==='articles')render();}).catch(()=>{});
fetch('data/comments.json?'+Date.now()).then(r=>r.ok?r.json():null).then(c=>{COMMENTS=c;render();}).catch(()=>{});
fetch('data/charts.json?'+Date.now()).then(r=>r.ok?r.json():null).then(c=>{CHARTS=c;}).catch(()=>{});
fetch('data/alerts.json?'+Date.now()).then(r=>r.ok?r.json():null).then(a=>{ALERTS=a;updateBadge();if(view==='watch')render();}).catch(()=>{});
document.getElementById('q').addEventListener('input',render);
</script>
</body>
</html>
