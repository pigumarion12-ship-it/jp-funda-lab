<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>FundaLab | ファンダラボ</title>
<style>
:root{
  --bg:#f2f6fb; --card:#ffffff; --text:#0e2038; --sub:#5f7189; --line:#e2e9f2;
  --accent:#1d5df2; --accent2:#38bdf8; --good:#089c6d; --warn:#d97706; --bad:#dc2626;
  --chip:#eef3fa; --drawer:#ffffff; --hover:#eaf1fd;
  --shadow:0 1px 2px rgba(14,32,56,.05), 0 4px 18px rgba(14,32,56,.05);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0b1524; --card:#121f33; --text:#e9eff8; --sub:#8ba0ba; --line:#22344e;
         --accent:#4c8dff; --accent2:#38bdf8; --good:#34d399; --warn:#fbbf24; --bad:#f87171;
         --chip:#1a2942; --drawer:#0e1a2c; --hover:#1a2942;
         --shadow:0 1px 2px rgba(0,0,0,.3); }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  font-size:14px; line-height:1.55;
  -webkit-font-smoothing:antialiased;}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;
  padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line);
  box-shadow:0 1px 8px rgba(14,32,56,.04)}
header::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--accent),var(--accent2))}
#menuBtn{border:1px solid var(--line);background:var(--card);color:var(--accent);
  border-radius:9px;font-size:17px;padding:5px 11px;cursor:pointer}
.brand{display:flex;align-items:center;gap:10px}
.bmark{flex:none;box-shadow:0 4px 10px rgba(29,93,242,.35);border-radius:8px}
.bword{font-size:17px;font-weight:800;letter-spacing:.06em;line-height:1.1}
.bword span{color:var(--accent)}
.sub{color:var(--sub);font-size:10.5px;margin-top:1px}
.vhead{font-weight:800;font-size:19px;padding:16px 16px 0;letter-spacing:.01em}

/* drawer */
#drawer{position:fixed;top:0;left:0;bottom:0;width:236px;background:var(--drawer);
  border-right:1px solid var(--line);z-index:40;transform:translateX(-100%);
  transition:transform .18s ease;padding:16px 12px;overflow-y:auto}
#drawer.open{transform:none}
#overlay{position:fixed;inset:0;background:rgba(8,20,40,.45);z-index:30;display:none}
#overlay.show{display:block}
.dttl{font-size:10.5px;color:var(--sub);margin:16px 10px 5px;letter-spacing:.12em;font-weight:600}
.mi{display:block;width:100%;text-align:left;border:0;background:none;color:var(--text);
  font-size:14px;font-weight:500;padding:9px 12px;border-radius:10px;cursor:pointer}
.mi:hover{background:var(--hover)}
.mi.active{background:var(--accent);color:#fff;font-weight:600;
  box-shadow:0 4px 12px rgba(29,93,242,.3)}
.mi.dis{color:var(--sub);opacity:.55}
.mi.dis:hover{background:none}
@media(min-width:960px){
  #drawer{transform:none}
  main{margin-left:236px}
  #menuBtn{display:none}
  #overlay{display:none!important}
}

.toolbar{display:flex;gap:8px;padding:12px 14px 8px;align-items:center}
.toolbar input{flex:1;padding:9px 14px;border:1px solid var(--line);border-radius:11px;
  background:var(--card);color:var(--text);font-size:13px;outline:none}
.toolbar input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(29,93,242,.12)}
.count{color:var(--sub);font-size:12px;white-space:nowrap}
.note{color:var(--sub);font-size:11px;padding:0 18px 8px}
.list{padding:0 12px 44px;display:flex;flex-direction:column;gap:10px;max-width:860px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:12px 14px;box-shadow:var(--shadow)}
.row1{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.nm{font-weight:700;font-size:15px}
.cd{color:var(--sub);font-weight:400;font-size:12px;margin-left:5px}
.score{font-weight:800;color:var(--accent);font-size:16.5px;white-space:nowrap;
  font-variant-numeric:tabular-nums}
.row2{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:7px;font-size:12.5px;
  font-variant-numeric:tabular-nums}
.kv b{font-weight:700}
.kv .l{color:var(--sub);font-size:11px}
.chips{margin-top:7px;display:flex;flex-wrap:wrap;gap:4px}
.chip{background:var(--chip);border-radius:7px;padding:2px 8px;font-size:11px;color:var(--sub);
  font-weight:500}
.chip.g{color:var(--good)} .chip.w{color:var(--warn)} .chip.b{color:var(--bad)}
.detail{display:none;margin-top:9px;border-top:1px solid var(--line);padding-top:9px;font-size:12.5px}
.card.open .detail{display:block}
.card.open{border-color:var(--accent)}
.hist{color:var(--sub)}
.links a{color:var(--accent);text-decoration:none;margin-right:14px;font-weight:600}
.empty{color:var(--sub);text-align:center;padding:44px 16px}
.pos{color:var(--good)} .neg{color:var(--bad)}
footer{color:var(--sub);font-size:11px;padding:0 18px 34px}
.grades{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.gr{display:inline-flex;flex-direction:column;align-items:center;border:1px solid var(--line);
  background:var(--chip);border-radius:9px;padding:3px 7px;min-width:46px}
.gr .gl{font-size:9.5px;color:var(--sub)}
.gr .gv{font-weight:800;font-size:14.5px}
.gA{color:var(--good)} .gB{color:var(--accent)} .gC{color:var(--sub)}
.gD{color:var(--warn)} .gE{color:var(--bad)}
.comment{margin-top:9px;background:linear-gradient(135deg,rgba(29,93,242,.06),rgba(56,189,248,.06));
  border:1px solid rgba(29,93,242,.18);border-radius:11px;padding:9px 11px;font-size:12.5px}
.comment .ct{font-weight:700;font-size:11.5px;color:var(--accent);margin-bottom:3px}
/* articles */
.feed{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;
  box-shadow:var(--shadow)}
.fhead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.fttl{font-weight:700;font-size:14.5px}
.fdesc{color:var(--sub);font-size:11.5px;margin-top:2px}
.fbtn{border:1px solid var(--line);background:var(--chip);color:var(--accent);border-radius:9px;
  padding:5px 10px;font-size:11.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.fbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.arts{margin-top:9px;display:flex;flex-direction:column;gap:2px}
.art{display:flex;align-items:baseline;gap:8px;padding:8px 4px;border-top:1px solid var(--line);
  color:var(--text);text-decoration:none;font-size:13px}
.art:hover{color:var(--accent)}
.art .ad{color:var(--sub);font-size:11px;font-variant-numeric:tabular-nums;flex:none}
.art .at{flex:1;min-width:0}
.art .asrc{flex:none;color:var(--sub);font-size:10.5px;opacity:.7;white-space:nowrap}
.fchips{display:flex;gap:6px;overflow-x:auto;padding:10px 2px}
.fchip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--sub);
  border-radius:16px;padding:5px 13px;font-size:12px;font-weight:600;cursor:pointer}
.fchip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.artlist{background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:4px 12px 8px;box-shadow:var(--shadow)}
.newb{display:inline-block;background:linear-gradient(90deg,var(--accent),var(--accent2));
  color:#fff;font-size:9.5px;font-weight:700;border-radius:5px;
  padding:0 5px;margin-left:6px;vertical-align:1px}
/* chart popup */
.cbtn{border:1px solid var(--line);background:var(--chip);border-radius:8px;font-size:12px;
  padding:2px 7px;cursor:pointer;margin-left:6px;vertical-align:1px}
#chartpop{position:fixed;z-index:60;width:320px;max-width:92vw;background:var(--card);
  border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 40px rgba(8,20,40,.25);
  padding:12px;display:none}
#chartpop.show{display:block}
#chartpop .cph{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;
  font-weight:700;margin-bottom:4px}
#chartpop .cpd{color:var(--sub);font-size:10.5px;font-weight:400}
#chartpop .cpx{border:0;background:none;color:var(--sub);font-size:15px;cursor:pointer;padding:0 2px}
</style>
</head>
<body>
<div id="overlay" onclick="toggleMenu(false)"></div>
<nav id="drawer">
  <div class="dttl">スクリーニング</div>
  <button class="mi" data-v="niokutameo" onclick="go('niokutameo')">弐億貯男式</button>
  <button class="mi" data-v="kiyohara" onclick="go('kiyohara')">清原式</button>
  <button class="mi" data-v="dividend" onclick="go('dividend')">配当バリュー成長</button>
  <div class="dttl">分析</div>
  <button class="mi" data-v="analysis" onclick="go('analysis')">A〜E分析</button>
  <div class="dttl">読む</div>
  <button class="mi" data-v="articles" onclick="go('articles')">記事</button>
  <div class="dttl">今後</div>
  <button class="mi dis">ウォッチリスト (準備中)</button>
</nav>
<header>
  <button id="menuBtn" onclick="toggleMenu()">☰</button>
  <div class="brand">
    <svg class="bmark" width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#1d5df2"/><stop offset="1" stop-color="#38bdf8"/></linearGradient></defs><rect width="30" height="30" rx="8" fill="url(#lg)"/><polyline points="6,21 12,14.5 16,17.5 24,8" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="24" cy="8" r="2.2" fill="#fff"/></svg>
    <div><div class="bword">FUNDA<span>LAB</span></div><div class="sub" id="asof">読み込み中…</div></div>
  </div>
</header>
<main>
<div class="vhead" id="vtitle"></div>
<div class="toolbar" id="toolbar">
  <input id="q" type="search" placeholder="銘柄名・コード・業種で絞り込み">
  <span class="count" id="count"></span>
</div>
<div class="note" id="note"></div>
<div class="list" id="list"><div class="empty">データを読み込んでいます…</div></div>
<footer>出所: J-Quants (Standard)・EDINET / 毎営業日 20:30台に自動更新。投資判断は自己責任で。<br>
PERの「予」は会社予想EPS・「実」は直近実績EPSベース。</footer>
</main>
<div id="chartpop"></div>
<script>
let DATA=null, ANALYSIS=null, ARTICLES=null, COMMENTS=null, CHARTS=null, view='niokutameo';
let hoverTimer=null;
function svgChart(c){
  const W=294,H=130,P=4;
  const mn=Math.min(...c),mx=Math.max(...c),rg=(mx-mn)||1;
  const X=i=>P+(W-2*P)*i/(c.length-1), Y=v=>H-P-(H-2*P)*(v-mn)/rg;
  const pts=c.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`);
  const ma=[];for(let i=0;i<c.length;i++){if(i>=24){let s=0;for(let j=i-24;j<=i;j++)s+=c[j];ma.push(`${X(i).toFixed(1)},${Y(s/25).toFixed(1)}`)}}
  const up=c[c.length-1]>=c[0];
  const col=up?'var(--accent)':'var(--bad)';
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
    <defs><linearGradient id="gf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${up?'#1d5df2':'#dc2626'}" stop-opacity=".18"/>
      <stop offset="1" stop-color="${up?'#1d5df2':'#dc2626'}" stop-opacity="0"/></linearGradient></defs>
    <polygon points="${P},${H-P} ${pts.join(' ')} ${W-P},${H-P}" fill="url(#gf)"/>
    <polyline points="${pts.join(' ')}" fill="none" stroke="${col}" stroke-width="1.8"/>
    ${ma.length?`<polyline points="${ma.join(' ')}" fill="none" stroke="var(--warn)" stroke-width="1" opacity=".8"/>`:''}
  </svg>`;
}
function showChart(code4,name,anchor,ev){
  if(ev)ev.stopPropagation();
  const pop=document.getElementById('chartpop');
  const s=CHARTS&&CHARTS.series&&CHARTS.series[code4];
  if(!s){pop.classList.remove('show');return;}
  const c=s.c,chg=((c[c.length-1]/c[0]-1)*100).toFixed(1);
  pop.innerHTML=`<div class="cph"><span>${name} <span class="cpd">${code4}</span></span>
    <span><span class="${chg>=0?'pos':'neg'}">${chg>=0?'+':''}${chg}%</span>
    <span class="cpd"> 1年</span> <button class="cpx" onclick="hideChart()">✕</button></span></div>
    ${svgChart(c)}
    <div class="cpd" style="display:flex;justify-content:space-between"><span>${s.s}</span><span>終値 ${c[c.length-1].toLocaleString()}円 <span style="color:var(--warn)">─</span>25MA</span><span>${s.e}</span></div>`;
  const r=anchor.getBoundingClientRect();
  const w=Math.min(320,window.innerWidth*0.92);
  let x=Math.min(r.left,window.innerWidth-w-8), y=r.bottom+8;
  if(y+190>window.innerHeight)y=Math.max(8,r.top-190);
  pop.style.left=Math.max(8,x)+'px'; pop.style.top=y+'px';
  pop.classList.add('show');
}
function hideChart(){document.getElementById('chartpop').classList.remove('show');}
function hoverChart(code4,name,el){
  if(!window.matchMedia('(hover: hover)').matches)return;
  clearTimeout(hoverTimer);
  hoverTimer=setTimeout(()=>showChart(code4,name,el),180);
}
function unhoverChart(){clearTimeout(hoverTimer);hoverTimer=setTimeout(hideChart,250);}
document.addEventListener('click',e=>{
  const pop=document.getElementById('chartpop');
  if(pop.classList.contains('show')&&!pop.contains(e.target)&&!e.target.classList.contains('cbtn'))hideChart();
});
const VT={niokutameo:'弐億貯男式',kiyohara:'清原式',dividend:'配当バリュー成長',
          analysis:'A〜E分析',articles:'記事'};
const fmt=(v,suf='')=> (v===null||v===undefined)?'—':(v+suf);
const yen=(v)=> (v===null||v===undefined)?'—':(v>=10000? (v/10000).toFixed(1)+'兆':v.toLocaleString()+'億');
function toggleMenu(f){const d=document.getElementById('drawer'),o=document.getElementById('overlay');
  const open=f!==undefined?f:!d.classList.contains('open');
  d.classList.toggle('open',open);o.classList.toggle('show',open);}
function promoted(){try{return new Set(JSON.parse(localStorage.getItem('promotedFeeds')||'[]'))}catch(e){return new Set()}}
function setPromoted(s){try{localStorage.setItem('promotedFeeds',JSON.stringify([...s]))}catch(e){}}
function togglePromote(id){const s=promoted(); s.has(id)?s.delete(id):s.add(id); setPromoted(s); render();}

function commentBlock(code4){
  if(!COMMENTS||!COMMENTS.items||!COMMENTS.items[code4])return '';
  const c=COMMENTS.items[code4];
  const src=(c.sources||[]).map(s=>`<a href="${s.url}" target="_blank" rel="noopener">${s.label}</a>`).join(' ');
  return `<div class="comment"><div class="ct">📝 解説 (${COMMENTS.as_of||''})</div>
    ${c.reason?`<div>${c.reason}</div>`:''}
    ${c.risk?`<div style="margin-top:3px">⚠ ${c.risk}</div>`:''}
    ${src?`<div class="links" style="margin-top:4px">出典: ${src}</div>`:''}</div>`;
}
function chips(r){
  const c=[];
  if(r.fcst_zoshu&&r.fcst_zoeki)c.push(['今期増収増益予想','g']);
  if(r.eps_uptrend)c.push(['EPS上昇傾向','g']);
  if(r.eps_uptrend===false)c.push(['EPS頭打ち','w']);
  if(r.div_no_cut)c.push(['減配なし','g']);
  if(r.div_no_cut===false)c.push(['減配あり','b']);
  if(r.div_up)c.push(['増配基調','g']);
  if(r.yield>=3)c.push(['利回り3%超','g']);
  if(r.payout!==null&&r.payout>=30&&r.payout<=40)c.push(['配当性向30-40%','g']);
  if(r.payout!==null&&r.payout>70)c.push(['配当過剰?','b']);
  if(r.cfo_pos===false)c.push(['営業CF赤字','b']);
  if(r.netcash_ratio!==null&&r.netcash_ratio!==undefined&&r.netcash_ratio>=100)c.push(['実質キャッシュ>時価総額','g']);
  if(COMMENTS&&COMMENTS.items&&COMMENTS.items[r.code4])c.push(['📝解説あり','g']);
  return c.map(x=>`<span class="chip ${x[1]}">${x[0]}</span>`).join('');
}
function card(r,i){
  const kab=`https://kabutan.jp/stock/?code=${r.code4}`;
  const buf=`https://www.buffett-code.com/company/${r.code4}/`;
  return `<div class="card" onclick="if(event.target.tagName!=='A')this.classList.toggle('open')">
  <div class="row1"><div class="nm" onmouseenter="hoverChart('${r.code4}','${(r.name||'').replace(/'/g,'')}',this)" onmouseleave="unhoverChart()">${i+1}. ${r.name||''}<span class="cd">${r.code4} ・ ${r.sector||''}</span><button class="cbtn" onclick="showChart('${r.code4}','${(r.name||'').replace(/'/g,'')}',this,event)">📈</button></div>
    <div class="score">${fmt(r.score)}</div></div>
  <div class="row2">
    <span class="kv"><span class="l">株価</span> <b>${fmt(r.price)}</b></span>
    <span class="kv"><span class="l">時価総額</span> <b>${yen(r.mcap_oku)}</b></span>
    <span class="kv"><span class="l">PER</span> <b>${fmt(r.per)}</b><span class="l">${r.per_kind||''}</span></span>
    <span class="kv"><span class="l">PBR</span> <b>${fmt(r.pbr)}</b></span>
    <span class="kv"><span class="l">利回り</span> <b>${fmt(r.yield,'%')}</b></span>
    <span class="kv"><span class="l">ROE</span> <b>${fmt(r.roe,'%')}</b></span>
    ${r.netcash_ratio!==null&&r.netcash_ratio!==undefined?`<span class="kv"><span class="l">NC比率</span> <b>${r.netcash_ratio}%</b></span>`:''}
  </div>
  <div class="chips">${chips(r)}</div>
  <div class="detail">
    <div>売上CAGR3y <b>${fmt(r.sales_cagr3,'%')}</b> ・ 営利CAGR3y <b>${fmt(r.op_cagr3,'%')}</b> ・ 営利率 <b>${fmt(r.op_margin,'%')}</b> ・ 自己資本比率 <b>${fmt(r.eqar,'%')}</b></div>
    <div>配当 <b>${fmt(r.dps,'円')}</b> ・ 配当性向 <b>${fmt(r.payout,'%')}</b>${r.seisan_oku!==null&&r.seisan_oku!==undefined?` ・ 清算価値 <b>${yen(r.seisan_oku)}</b>`:''}</div>
    <div class="hist">EPS推移: ${r.eps_hist&&r.eps_hist.length?r.eps_hist.join(' → '):'—'}</div>
    <div class="hist">配当推移: ${r.dps_hist&&r.dps_hist.length?r.dps_hist.join(' → '):'—'}</div>
    <div class="hist">売上(億): ${r.sales_hist&&r.sales_hist.length?r.sales_hist.join(' → '):'—'} ・ 営利(億): ${r.op_hist&&r.op_hist.length?r.op_hist.join(' → '):'—'}</div>
    ${commentBlock(r.code4)}
    <div class="links" style="margin-top:6px">
      <a href="${kab}" target="_blank" rel="noopener">株探</a>
      <a href="${buf}" target="_blank" rel="noopener">バフェットコード</a>
      <a href="https://www.tradingview.com/chart/?symbol=TSE%3A${r.code4}" target="_blank" rel="noopener">チャート</a>
    </div>
  </div></div>`;
}
const GLABELS=['①資産','②収益割安','③財務','④収益性','⑤成長','⑦還元'];
function gradeChips(g){
  const keys=['asset','earnings','health','profit','growth','payout'];
  return '<div class="grades">'+keys.map((k,i)=>{
    const v=g[k]||'—';
    return `<span class="gr"><span class="gl">${GLABELS[i]}</span><span class="gv g${v}">${v}</span></span>`;
  }).join('')+'</div>';
}
function analysisCard(r,i){
  const kab=`https://kabutan.jp/stock/?code=${r.code4}`;
  const buf=`https://www.buffett-code.com/company/${r.code4}/`;
  const danger=r.danger&&r.danger.length?`<div class="chips">${r.danger.map(d=>`<span class="chip b">⚠${d}</span>`).join('')}</div>`:'';
  return `<div class="card" onclick="if(event.target.tagName!=='A')this.classList.toggle('open')">
  <div class="row1"><div class="nm" onmouseenter="hoverChart('${r.code4}','${(r.name||'').replace(/'/g,'')}',this)" onmouseleave="unhoverChart()">${i+1}. ${r.name||''}<span class="cd">${r.code4} ・ ${r.sector||''}</span><button class="cbtn" onclick="showChart('${r.code4}','${(r.name||'').replace(/'/g,'')}',this,event)">📈</button></div>
    <div class="score">${r.composite}</div></div>
  ${gradeChips(r.grades)}
  ${danger}
  <div class="detail">
    <div>時価総額 <b>${yen(r.mcap_oku)}</b> ・ PER <b>${fmt(r.per)}</b> ・ PBR <b>${fmt(r.pbr)}</b> ・ 利回り <b>${fmt(r.yield,'%')}</b></div>
    <div>清算価値 <b>${yen(r.seisan_oku)}</b>${r.seisan_oku!==null&&r.mcap_oku&&r.mcap_oku<r.seisan_oku?' <span class="pos">(時価総額が清算価値を下回る)</span>':''} ・ NC比率 <b>${fmt(r.netcash_ratio,'%')}</b></div>
    <div>DCFレンジ: 弱気 <b>${yen(r.dcf_weak_oku)}</b> 〜 強気 <b>${yen(r.dcf_strong_oku)}</b> (対 時価総額 ${yen(r.mcap_oku)})</div>
    <div class="hist">EDINET期末: ${r.edinet_end||'—'} ・ Aが1つでもあれば買材料(手順§5)。⑥事業素質は定性のため未採点</div>
    ${commentBlock(r.code4)}
    <div class="links" style="margin-top:6px">
      <a href="${kab}" target="_blank" rel="noopener">株探</a>
      <a href="${buf}" target="_blank" rel="noopener">バフェットコード</a>
    </div>
  </div></div>`;
}
let artFilter='all';
function setArtFilter(id){artFilter=id;render();}
function artRow(a){
  return `<a class="art" href="${a.url}" target="_blank" rel="noopener">
    <span class="ad">${(a.date||'').slice(5)}</span>
    <span class="at">${a.title}${a.new?'<span class="newb">NEW</span>':''}</span>
    <span class="asrc">${a.fl||''}</span></a>`;
}
function candBlock(f){
  const items=(f.items||[]).slice(0,3).map(a=>
    `<a class="art" href="${a.url}" target="_blank" rel="noopener"><span class="ad">${(a.date||'').slice(5)}</span><span class="at">${a.title}</span></a>`).join('');
  return `<div class="feed">
    <div class="fhead"><div><div class="fttl">${f.label}</div><div class="fdesc">${f.desc||''}</div></div>
    <button class="fbtn" onclick="togglePromote('${f.id}')">☆ よく見るへ</button></div>
    <div class="arts">${items||`<div class="empty" style="padding:12px">自動リスト化できないサイト。リンクから直接どうぞ。</div>`}</div>
    <div class="links" style="margin-top:8px"><a href="${f.home}" target="_blank" rel="noopener">サイトで一覧を開く →</a></div>
  </div>`;
}
function renderArticles(){
  document.getElementById('toolbar').style.display='none';
  document.getElementById('note').textContent='';
  if(!ARTICLES){document.getElementById('list').innerHTML='<div class="empty">記事データはまだありません(次回更新で表示されます)</div>';return;}
  const p=promoted();
  const included=ARTICLES.feeds.filter(f=>f.kind==='watch'||p.has(f.id));
  const cand=ARTICLES.feeds.filter(f=>f.kind==='candidate'&&!p.has(f.id));
  let items=[];
  included.forEach(f=>(f.items||[]).forEach(a=>items.push({...a,fid:f.id,fl:f.short||f.label})));
  items.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  if(artFilter!=='all'&&included.some(f=>f.id===artFilter))
    items=items.filter(a=>a.fid===artFilter);
  const chips=`<div class="fchips">
    <button class="fchip ${artFilter==='all'?'on':''}" onclick="setArtFilter('all')">すべて</button>
    ${included.map(f=>`<button class="fchip ${artFilter===f.id?'on':''}" onclick="setArtFilter('${f.id}')">${f.short||f.label}${f.kind==='candidate'?' ★':''}</button>`).join('')}
  </div>`;
  let h=chips;
  h+=`<div class="artlist">${items.length?items.map(artRow).join(''):'<div class="empty">記事がありません</div>'}</div>`;
  const cur=included.find(f=>f.id===artFilter);
  if(cur)h+=`<div class="links" style="padding:4px 6px"><a href="${cur.home}" target="_blank" rel="noopener">${cur.label} をサイトで開く →</a>${cur.kind==='candidate'?` <a href="javascript:void(0)" onclick="togglePromote('${cur.id}')">★解除して候補に戻す</a>`:''}</div>`;
  if(cand.length){
    h+=`<div class="dttl" style="padding:14px 6px 4px">記事候補 (☆でよく見るへ追加)</div>`;
    h+=cand.map(candBlock).join('');
  }
  document.getElementById('list').innerHTML=h;
}
function render(){
  document.querySelectorAll('.mi[data-v]').forEach(e=>e.classList.toggle('active',e.dataset.v===view));
  document.getElementById('vtitle').textContent=VT[view]||'ファンダ・ラボ';
  if(view==='articles'){renderArticles();document.getElementById('count').textContent='';return;}
  document.getElementById('toolbar').style.display='';
  const q=document.getElementById('q').value.trim().toLowerCase();
  if(view==='analysis'){
    if(!ANALYSIS){document.getElementById('list').innerHTML='<div class="empty">A〜E分析データはまだありません(EDINET初回取得後に表示されます)</div>';document.getElementById('count').textContent='';return;}
    let items=ANALYSIS.items;
    if(q)items=items.filter(r=>((r.name||'')+(r.code4||'')+(r.sector||'')).toLowerCase().includes(q));
    document.getElementById('count').textContent=`${items.length}件`;
    document.getElementById('note').textContent=ANALYSIS.note||'';
    document.getElementById('list').innerHTML=
      items.length?items.map(analysisCard).join(''):'<div class="empty">該当なし</div>';
    return;
  }
  if(!DATA)return;
  const s=DATA.screens[view];
  let items=s.items;
  if(q)items=items.filter(r=>((r.name||'')+(r.code4||'')+(r.sector||'')).toLowerCase().includes(q));
  document.getElementById('count').textContent=`${items.length}/${s.count}件`;
  document.getElementById('note').textContent=(DATA.notes&&view==='kiyohara')?DATA.notes.kiyohara:'';
  document.getElementById('list').innerHTML=
    items.length?items.map(card).join(''):'<div class="empty">条件に合致する銘柄がありません</div>';
}
function go(v){view=v;toggleMenu(false);render();window.scrollTo(0,0);}
fetch('data/latest.json?'+Date.now()).then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{
  DATA=d;
  document.getElementById('asof').textContent=
    `データ基準日 ${d.as_of||'—'} ・ 更新 ${d.generated_at||'—'} ・ 対象 ${d.universe}銘柄`;
  render();
}).catch(()=>{
  document.getElementById('asof').textContent='初回データ生成待ち';
  document.getElementById('list').innerHTML='<div class="empty">まだデータがありません。</div>';
});
fetch('data/analysis.json?'+Date.now()).then(r=>r.ok?r.json():null).then(a=>{ANALYSIS=a;if(view==='analysis')render();}).catch(()=>{});
fetch('data/articles.json?'+Date.now()).then(r=>r.ok?r.json():null).then(a=>{ARTICLES=a;if(view==='articles')render();}).catch(()=>{});
fetch('data/comments.json?'+Date.now()).then(r=>r.ok?r.json():null).then(c=>{COMMENTS=c;render();}).catch(()=>{});
fetch('data/charts.json?'+Date.now()).then(r=>r.ok?r.json():null).then(c=>{CHARTS=c;}).catch(()=>{});
document.getElementById('q').addEventListener('input',render);
</script>
</body>
</html>
